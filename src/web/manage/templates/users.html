{% extends "base.html" %}

{% block content %}
<h1> Users </h1> <a name="" id="" class="btn btn-primary" href="{{url_for("manage.create_user")}}" role="button">Create New User</a>
<table class="table table-striped table-responsive">
        <thead class="thead-inverse">
                <tr>
                        <th>Id</th>
                        <th>Username</th>
                        <th>Fullname</th>
                        <th>Role</th>
                        <th>Action</th>
                </tr>
                </thead>
                <tbody>
                        {% for user in users %}
                        <tr>
                                <td scope="row">{{ user.id }}</td>
                                <td>{{ user.username }} </td>
                                <td>{{ user.full_name }}</td>
                                <td>{{ user.role.title }}</td>
                                <td>
                                        <a name="" id="" class="btn btn-secondary" href="{{url_for("manage.edit_user", user=user.username)}}" role="button">Edit</a>
                                        <a name="" id="" class="btn btn-secondary" href="{{url_for("manage.delete_user", user=user.username)}}" role="button">Delete</a>
                                        
                                </td>
                        </tr>
                        {% endfor %}
                </tbody>
</table>
{% endblock %}
